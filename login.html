<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimelapsePVP - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">

    <main class="login-wrapper">
        <div class="glass-card login-card">
            <div class="login-avatar"><i class="fa-solid fa-shield-cat"></i></div>
            <h2>STAFF PORTAL</h2>
            <p class="login-subtext">Please sign in with your staff account.</p>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <input type="text" id="username" class="soft-input" placeholder="Username" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" class="soft-input" placeholder="Password" required>
                </div>
                <div id="errorAlert" class="soft-alert" style="display: none;"></div>
                <button type="submit" class="cta-btn primary" style="width: 100%; justify-content: center;">Sign In</button>
            </form>
        </div>
    </main>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const uInput = document.getElementById('username').value.trim();
            const pInput = document.getElementById('password').value;
            const alertEl = document.getElementById('errorAlert');

            let users = JSON.parse(localStorage.getItem('timelapse_users')) || [
                { username: 'J33lF', password: '123', role: 'Admin', status: 'Active', created: '2026-01-01' }
            ];

            const foundUser = users.find(u => u.username.toLowerCase() === uInput.toLowerCase() && u.password === pInput);

            if (foundUser) {
                if (foundUser.status === 'Suspended') {
                    alertEl.innerText = 'Account suspended. Contact administration.';
                    alertEl.style.display = 'block';
                    return;
                }

                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('username', foundUser.username);
                sessionStorage.setItem('userRole', foundUser.role);
                window.location.href = 'dashboard.html';
            } else {
                alertEl.innerText = 'Invalid username or password.';
                alertEl.style.display = 'block';
            }
        }
    </script>
</body>
</html>
